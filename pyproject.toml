[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transformer-lab"
version = "0.1.0"
description = "A from-scratch decoder-only Transformer learning project."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "huggingface-hub>=0.23,<3",
    "numpy>=1.26,<3",
    "pyyaml>=6,<7",
    "safetensors>=0.4,<1",
    "tokenizers>=0.20,<1",
    "torch==2.9.1",
]

[dependency-groups]
dev = [
    "matplotlib>=3.8,<4",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
    "transformers>=4.51,<6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
