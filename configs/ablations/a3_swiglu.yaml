# M3 消融 A3 前馈子层：SwiGLU（隐藏维度 8C/3 = 1024）代替 GELU MLP，参数量 13,969,152，与对照组相同
# 与 configs/ablations/a0_control.yaml 只差：mlp（以及 out_dir）；由 tests/test_ablation_configs.py 检查
# 种子用命令行覆盖 seed 与 out_dir，命令见 docs/m3-windows-run.md
data_dir: data/tinystories
out_dir: runs/m3/a3_swiglu/seed1337

n_layers: 6
n_heads: 6
d_model: 384
block_size: 512
mlp: swiglu

batch_size: 32
grad_accum_steps: 2
learning_rate: 6.0e-4
weight_decay: 0.01
max_iters: 3052
grad_clip: 1.0
lr_schedule: cosine
warmup_iters: 92
min_lr: 6.0e-5

eval_interval: 250
eval_iters: 20
ckpt_interval: 1000
resume: false
seed: 1337
device: auto
