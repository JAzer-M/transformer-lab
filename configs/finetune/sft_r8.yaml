# LoRA SFT 的起点（r=8）。超参数要先在 WSL 上短测，再由用户确认
repo: Qwen/Qwen3-0.6B-Base
data_dir: data/gsm8k
split_file: configs/finetune/gsm8k_sft_split.json
out_dir: runs/m5/sft_r8
r: 8
alpha: 16.0
targets: [q_proj, k_proj, v_proj, out_proj]
learning_rate: 2.0e-4
min_lr: 2.0e-5
warmup_iters: 20
weight_decay: 0.0
beta1: 0.9
beta2: 0.999
grad_clip: 1.0
batch_size: 4
grad_accum_steps: 4
max_len: 512
epochs: 1
eval_interval: 50
eos_token_id: 151643 # 基座的 <|endoftext|>，也拿来当 pad
base_dtype: float32
seed: 1337
device: auto
