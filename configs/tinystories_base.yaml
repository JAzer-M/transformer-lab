# 用户于 2026-11-02 确认采用 M2_PREPARE_RESULT.md 的配置并开始训练。
# 参数量 13,969,152；2026-11-01 batch 32 短跑显存峰值 4,951.50 MiB。
# batch 32 × 梯度累积 2 = 有效 batch 64；10,000 步共 327,680,000 token。
data_dir: data/tinystories
out_dir: runs/tinystories_base

n_layers: 6
n_heads: 6
d_model: 384
block_size: 512

batch_size: 32
grad_accum_steps: 2
learning_rate: 6.0e-4
weight_decay: 0.01
max_iters: 10000
grad_clip: 1.0
lr_schedule: cosine
warmup_iters: 300
min_lr: 6.0e-5

eval_interval: 500
eval_iters: 20
ckpt_interval: 1000
resume: false
seed: 1337
device: auto
